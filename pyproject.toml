[project]
name = "maildrop"
version = "1.0.0"
description = "A simple self hosted email service."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtpd>=1.4.6",
    "flask>=3.1.3",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "setuptools>=83.0.0",
]

[project.scripts]
maildrop = "maildrop.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"